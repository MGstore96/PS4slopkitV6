<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS4 SlopKit - Poops</title>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100vh;
    background: radial-gradient(circle at center, #6b7280 0%, #374151 40%, #111827 80%, #030712 100%);
    color: #e5e7eb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 12px;
  }

  .main-wrapper {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  /* Title Header */
  .title-group {
    text-align: center;
  }

  .title-main {
    font-size: 24px;
    font-weight: 800;
    color: #ffffff;
    margin: 0;
  }

  .title-main span {
    color: #ef4444;
  }

  /* Status Badge Top */
  #state {
    display: inline-block;
    margin-top: 6px;
    padding: 4px 14px;
    background: rgba(245, 158, 11, 0.25);
    border: 1px solid #f59e0b;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #fde68a;
  }

  /* Dynamic State Color Helpers */
  #state.bad { background: rgba(239, 68, 68, 0.25); border-color: #ef4444; color: #fca5a5; }
  #state.warn { background: rgba(245, 158, 11, 0.25); border-color: #f59e0b; color: #fde68a; }
  #state.ok { background: rgba(16, 185, 129, 0.25); border-color: #10b981; color: #6ee7b7; }

  /* Logo Container */
  .logo-box {
    width: 140px;
    height: 140px;
    background: #ffffff;
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    margin: 4px 0;
    padding: 10px;
  }

  .logo-box img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 14px;
  }

  /* Console Log Terminal Box */
  #out {
    width: 100%;
    background: #000000;
    border-radius: 18px;
    padding: 16px;
    font-family: "Courier New", Courier, monospace;
    font-size: 12px;
    line-height: 1.5;
    color: #9ca3af;
    height: 260px;
    overflow-y: auto;
    box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.8);
    word-break: break-all;
    white-space: pre-wrap;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }

  .ok { color: #10b981; } 
  .bad { color: #ef4444; } 
  .warn { color: #f59e0b; }

  /* Footer Credits */
  .footer-group {
    width: 100%;
    text-align: center;
  }

  .credits {
    font-size: 10px;
    color: #3b82f6;
    margin: 0;
    line-height: 1.4;
  }
</style>
</head>
<body>

<div class="main-wrapper">

  <!-- Header -->
  <div class="title-group">
    <h1 class="title-main"><span>PS4</span> SlopKit</h1>
    <div id="state">loading poops chain...</div>
  </div>

  <!-- Logo Card -->
  <div class="logo-box" id="brand">
    <img src="logo.png" alt="mg Logo">
  </div>

  <!-- Terminal Output Window -->
  <div id="out"></div>

  <!-- Footer -->
  <div class="footer-group">
    <p class="credits">Special thanks to Jordy, egycnq, TheFlow, abc and PS5 R&amp;D group</p>
  </div>

</div>

<script type="module">import "./chain_poops.js";</script>
</body>
</html>
