<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS4 SlopKit</title>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100vh;
    background: radial-gradient(circle at center, #6b7280 0%, #374151 40%, #111827 80%, #030712 100%);
    color: #e5e7eb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 12px;
  }

  .main-wrapper {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  /* Title Header */
  .title-group {
    text-align: center;
  }

  .title-main {
    font-size: 24px;
    font-weight: 800;
    color: #ffffff;
    margin: 0;
  }

  .title-main span {
    color: #ef4444;
  }

  /* Status Badge Top */
  #state {
    display: inline-block;
    margin-top: 6px;
    padding: 4px 14px;
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #f3f4f6;
  }

  /* Dynamic State Color Helpers */
  #state.bad { background: rgba(239, 68, 68, 0.25); border-color: #ef4444; color: #fca5a5; }
  #state.warn { background: rgba(245, 158, 11, 0.25); border-color: #f59e0b; color: #fde68a; }
  #state.ok { background: rgba(16, 185, 129, 0.25); border-color: #10b981; color: #6ee7b7; }

  /* Logo Container */
  .logo-box {
    width: 180px;
    height: 180px;
    background: #ffffff;
    border-radius: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    margin: 8px 0;
    padding: 12px;
  }

  .logo-box img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 16px;
  }

  /* Control Panel Box (Rounded Gray Card) */
  .panel-card {
    width: 100%;
    background: rgba(31, 41, 55, 0.7);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    padding: 18px 16px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .pill-info {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: #d1d5db;
  }

  .pill-dot {
    width: 8px;
    height: 8px;
    background: #ffffff;
    border-radius: 50%;
  }

  /* Interactive Button GoldHEN */
  .btn-goldhen {
    width: 100%;
    padding: 12px;
    background: linear-gradient(180deg, #2563eb 0%, #1e40af 100%);
    border: none;
    border-radius: 10px;
    color: #ffffff;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    cursor: pointer;
    user-select: none;
    transition: all 0.2s ease;
  }

  .btn-goldhen:hover {
    background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
    box-shadow: 0 6px 16px rgba(37, 99, 235, 0.5);
  }

  .btn-goldhen:active {
    transform: scale(0.98);
  }

  .btn-goldhen.disabled {
    opacity: 0.5;
    cursor: not-allowed;
    background: #4b5563;
    box-shadow: none;
  }

  /* Checkbox Row */
  .checkbox-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 13px;
    color: #9ca3af;
    cursor: pointer;
    user-select: none;
  }

  .checkbox-row input {
    cursor: pointer;
    width: 16px;
    height: 16px;
    accent-color: #2563eb;
  }

  /* Console Log Terminal Box */
  .terminal-box {
    width: 100%;
    background: #000000;
    border-radius: 18px;
    padding: 16px;
    font-family: "Courier New", Courier, monospace;
    font-size: 12px;
    line-height: 1.5;
    color: #9ca3af;
    min-height: 140px;
    max-height: 180px;
    overflow-y: auto;
    box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.8);
    word-break: break-all;
  }

  .terminal-box b {
    color: #ffffff;
  }

  /* Bottom Cache Status & Footer */
  .footer-group {
    width: 100%;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  #cache {
    font-size: 12px;
    color: #9ca3af;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  #cache::before {
    content: "";
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #6b7280;
  }

  #cache.cacheok::before {
    background: #10b981;
  }

  #cache.cacheok {
    color: #10b981;
  }

  .credits {
    font-size: 10px;
    color: #3b82f6;
    margin: 0;
    line-height: 1.4;
  }
</style>
</head>
<body>

<div class="main-wrapper">

  <!-- Header -->
  <div class="title-group">
    <h1 class="title-main"><span>PS4</span> SlopKit</h1>
    <div id="state">Detecting firmware...</div>
  </div>

  <!-- Logo Card -->
  <div class="logo-box" id="brand">
    <img src="logo.png" alt="mg Logo">
  </div>

  <!-- Panel Card -->
  <div class="panel-card">
    <div class="pill-info">
      <span class="pill-dot"></span>
      <span id="fw-pill">Auto FW Detection</span>
    </div>

    <button id="btn-goldhen" class="btn-goldhen">GoldHEN</button>

    <label class="checkbox-row" for="auto-jb-check">
      <span>Jailbreak Otomatis</span>
      <input type="checkbox" id="auto-jb-check" checked>
    </label>
  </div>

  <!-- Terminal / Log Window -->
  <div class="terminal-box" id="det">
    [System] INITIALIZING...
  </div>

  <!-- Status & Footer -->
  <div class="footer-group">
    <div id="cache">Idle</div>
    <p class="credits">Special thanks to Jordy, egycnq, TheFlow, abc and PS5 R&amp;D group</p>
  </div>

</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    var fwPillEl = document.getElementById("fw-pill");
    var goldhenBtn = document.getElementById("btn-goldhen");
    var autoJbCheck = document.getElementById("auto-jb-check");

    var timerId = null;
    var countdown = 5;

    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    
    function logMsg(msg) {
        var d = new Date();
        var timeStr = "[" + String(d.getHours()).padStart(2,'0') + "." 
                          + String(d.getMinutes()).padStart(2,'0') + "." 
                          + String(d.getSeconds()).padStart(2,'0') + "]";
        detEl.innerHTML += "<br>" + timeStr + " " + msg;
        detEl.scrollTop = detEl.scrollHeight;
    }

    var params = new URLSearchParams(location.search);

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var minor = parseInt(m[2], 16);
        var ms = minor.toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var bug = null, why = "";
    var forced = params.get("bug");
    if (forced === "lapse" || forced === "poops") {
        bug = forced; why = "forced via ?bug=" + forced;
    } else if (!key) {
        why = "USER-AGENT IS NOT A PLAYSTATION 4";
    } else if (fwnum <= 1202) {
        bug = "lapse"; why = key + " <= 12.02";
    } else if (fwnum >= 1250) {
        bug = "poops"; why = key + " >= 12.50";
    } else {
        why = key + " -- no working bug (lapse ends at 12.02, poops needs 12.50)";
    }

    if (key) {
        fwPillEl.textContent = key + " ONLY";
    }

    detEl.innerHTML = "[00.00.00] [System] SIAP."
        + "<br>[00.00.00] [FW] FIRMWARE: <b>" + (key || "UNKNOWN") + "</b>"
        + "<br>[00.00.00] [BUG] <b>" + (bug || "NONE") + "</b> (" + why + ")";

    if (!bug) { 
        setState("FIRMWARE TIDAK DI DUKUNG", "bad"); 
        goldhenBtn.classList.add("disabled");
        autoJbCheck.disabled = true;
        return; 
    }

    var target = (bug === "lapse" ? "run_lapse.html" : "run_poops.html") + location.search;

    function go() { 
        if (timerId) clearInterval(timerId);
        setState("LOADING " + bug.toUpperCase() + " CHAIN...", "warn");
        logMsg("[UI] MEMULAI JAILBREAK...");
        setTimeout(function() {
            location.replace(target); 
        }, 500);
    }

    // Fungsi Timer Auto Jailbreak 5 Detik
    function startAutoTimer() {
        if (timerId) clearInterval(timerId);
        countdown = 5;
        setState("OTOMATIS EKSEKUSI DALAM " + countdown + "S...", "warn");
        
        timerId = setInterval(function () {
            countdown--;
            if (countdown > 0) {
                setState("OTOMATIS EKSEKUSI DALAM " + countdown + "S...", "warn");
            } else {
                clearInterval(timerId);
                go();
            }
        }, 1000);
    }

    function stopAutoTimer() {
        if (timerId) {
            clearInterval(timerId);
            timerId = null;
            setState("SIAP (MANUAL)", "ok");
            logMsg("[UI] Hitung mundur otomatis dibatalkan.");
        }
    }

    // Listener Tombol GoldHEN (Eksekusi Manual Langsung)
    goldhenBtn.addEventListener("click", function () {
        if (!bug) return;
        logMsg("[UI] Tombol GoldHEN ditekan.");
        go();
    });

    // Listener Checkbox Auto Jailbreak
    autoJbCheck.addEventListener("change", function () {
        if (this.checked) {
            logMsg("[UI] Auto Jailbreak diaktifkan.");
            startAutoTimer();
        } else {
            stopAutoTimer();
        }
    });

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    // Logika Cache & Memulai Timer Pertama Kali
    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        if (autoJbCheck.checked) startAutoTimer();
    } else if (!navigator.onLine) {
        setCache("Offline -- Loaded from cache", true);
        if (autoJbCheck.checked) startAutoTimer();
    } else if (ac.status === ac.IDLE) {
        setCache("Idle", true);
        if (autoJbCheck.checked) startAutoTimer();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("Update downloaded", true);
        waitForTap("UPDATE READY -- PRESS X OR TAP TO RELOAD",
                   function () { location.reload(); });
    } else {
        setCache("Checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("Caching for offline use (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("Caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);

        ac.addEventListener("cached", function () {
            setCache("Cached for offline use", true);
            if (autoJbCheck.checked) startAutoTimer();
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("Update downloaded", true);
            waitForTap("UPDATE READY -- PRESS X OR TAP TO RELOAD",
                       function () { location.reload(); });
        }, false);

        ac.addEventListener("noupdate", function () {
            setCache("Cached -- Offline Ready", true);
            if (autoJbCheck.checked) startAutoTimer();
        }, false);
        ac.addEventListener("error", function () {
            setCache("Cache unavailable");
            if (autoJbCheck.checked) startAutoTimer();
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("Cache obsolete");
            if (autoJbCheck.checked) startAutoTimer();
        }, false);
    }
})();
</script>
</body>
</html>
